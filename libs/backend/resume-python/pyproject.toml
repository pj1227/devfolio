[tool.coverage.run]
branch = true
source = [ "devfolio_resume_python" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../../coverage/libs/backend/resume-python/html'
 --cov-report xml:'../../../coverage/libs/backend/resume-python/coverage.xml'
 --html='../../../reports/libs/backend/resume-python/unittests/html/index.html'
 --junitxml='../../../reports/libs/backend/resume-python/unittests/junit.xml'
"""
asyncio_mode = "auto"

[project]
name = "devfolio-resume-python"
version = "1.0.0"
description = "Automatically generated by Nx."
requires-python = ">=3.12,<4"
readme = 'README.md'
dependencies = [
  "pydantic>=2.9.0",
  "python-dotenv>1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["devfolio_resume_python"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "pytest-asyncio>=0.24.0",
  "pytest-mock>=3.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "dist",
]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]
ignore = []
fixable = ["ALL"]
unfixable = []