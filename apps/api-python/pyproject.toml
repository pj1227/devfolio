[tool.coverage.run]
branch = true
source = [ "api_python" ]

[tool.coverage.report]
exclude_lines = ['if TYPE_CHECKING:']
show_missing = true

[tool.pytest.ini_options]
addopts = """
 --cov
 --cov-report html:'../../coverage/apps/api-python/html'
 --cov-report xml:'../../coverage/apps/api-python/coverage.xml'
 --html='../../reports/apps/api-python/unittests/html/index.html'
 --junitxml='../../reports/apps/api-python/unittests/junit.xml'
"""
asyncio_mode = "auto"

[project]
name = "api-python"
version = "1.0.0"
description = "DevFolio Python/FastAPI backend"
requires-python = ">=3.12,<4"
readme = 'README.md'
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "devfolio-resume-python",
]

[tool.uv.sources]
devfolio-resume-python = { path = "../../libs/backend/resume-python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["api_python"]

[tool.hatch.metadata]
allow-direct-references = true

[dependency-groups]
dev = [
  "autopep8>=2.3.1",
  "ruff>=0.8.2",
  "pytest>=8.3.4",
  "pytest-sugar>=1.0.0",
  "pytest-cov>=6.0.0",
  "pytest-html>=4.1.1",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
exclude = [".ruff_cache", ".svn", ".tox", ".venv", "dist"]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []